 const b=!pr?230:pr.startsWith('she')?560:pr.startsWith('he')?250:390;return b*(.94+Math.random()*.12)}

 st.style.background=BGIMG[b.id]?`url(${BGIMG[b.id]}) center/cover`:b.c;$('#bgl').textContent=BGIMG[b.id]?'':b.name[ST.lang];
